<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" class="design-image graphic-design">
  <defs>
    <linearGradient id="graphicGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4d7d;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#d64d7d;stop-opacity:0.05" />
    </linearGradient>
    <pattern id="circlePattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="2" fill="#ff4d7d" opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background gradient -->
  <rect width="800" height="800" fill="url(#graphicGradient)"/>

  <!-- Circle pattern -->
  <rect width="800" height="800" fill="url(#circlePattern)"/>

  <!-- Design elements showcase -->
  <g>
    <!-- Color palette section -->
    <text x="60" y="140" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ff4d7d">
      Branding
    </text>

    <!-- Color swatches -->
    <g>
      <!-- Swatch 1 -->
      <rect x="60" y="170" width="90" height="120" fill="#ff4d7d" rx="8"/>
      <text x="105" y="280" font-family="sans-serif" font-size="11" fill="rgba(0,0,0,0.7)" text-anchor="middle" font-weight="600">
        Primary
      </text>

      <!-- Swatch 2 -->
      <rect x="170" y="170" width="90" height="120" fill="#ffa500" rx="8"/>
      <text x="215" y="280" font-family="sans-serif" font-size="11" fill="rgba(0,0,0,0.7)" text-anchor="middle" font-weight="600">
        Warm
      </text>

      <!-- Swatch 3 -->
      <rect x="280" y="170" width="90" height="120" fill="#00d9ff" rx="8"/>
      <text x="325" y="280" font-family="sans-serif" font-size="11" fill="rgba(0,0,0,0.7)" text-anchor="middle" font-weight="600">
        Accent
      </text>

      <!-- Swatch 4 -->
      <rect x="390" y="170" width="90" height="120" fill="#f0f2f5" rx="8" stroke="#ff4d7d" stroke-width="1"/>
      <text x="435" y="280" font-family="sans-serif" font-size="11" fill="#ff4d7d" text-anchor="middle" font-weight="600">
        Light
      </text>
    </g>

    <!-- Typography section -->
    <text x="60" y="350" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ff4d7d">
      Tipografía
    </text>

    <!-- Font samples -->
    <g>
      <text x="60" y="400" font-family="sans-serif" font-size="32" font-weight="bold" fill="#f0f2f5">
        Display Font
      </text>
      <text x="60" y="430" font-family="sans-serif" font-size="14" fill="#8b9dc3">
        Moderna, geométrica y versátil
      </text>

      <text x="60" y="480" font-family="sans-serif" font-size="18" font-weight="600" fill="#ff4d7d">
        Body Copy Font
      </text>
      <text x="60" y="505" font-family="sans-serif" font-size="13" fill="#8b9dc3">
        Legible, limpia, profesional. Perfecta para textos largos y párrafos.
      </text>
    </g>

    <!-- Logo mark examples -->
    <text x="60" y="580" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ff4d7d">
      Elementos Gráficos
    </text>

    <g>
      <!-- Mark 1 -->
      <circle cx="120" cy="650" r="30" fill="none" stroke="#ff4d7d" stroke-width="2"/>
      <path d="M 100 650 Q 120 630 140 650" fill="none" stroke="#ff4d7d" stroke-width="2" stroke-linecap="round"/>

      <!-- Mark 2 -->
      <g transform="translate(240, 650)">
        <rect x="-25" y="-25" width="50" height="50" fill="none" stroke="#ff4d7d" stroke-width="2" rx="8"/>
        <line x1="-10" y1="-25" x2="10" y2="25" stroke="#ff4d7d" stroke-width="2" stroke-linecap="round"/>
      </g>

      <!-- Mark 3 -->
      <g transform="translate(360, 650)">
        <polygon points="0,-25 22,-8 14,20 -14,20 -22,-8" fill="none" stroke="#ff4d7d" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="0" cy="0" r="5" fill="#ff4d7d"/>
      </g>

      <!-- Mark 4 -->
      <g transform="translate(480, 650)">
        <path d="M -20 -20 L 20 -20 L 20 20 L -20 20 Z" fill="none" stroke="#ff4d7d" stroke-width="2"/>
        <circle cx="-10" cy="-10" r="4" fill="#ff4d7d" opacity="0.6"/>
        <circle cx="10" cy="10" r="4" fill="#ff4d7d" opacity="0.6"/>
      </g>
    </g>

    <!-- Print materials indication -->
    <g opacity="0.7">
      <rect x="600" y="400" width="140" height="180" fill="none" stroke="#ff4d7d" stroke-width="1.5" stroke-dasharray="5,5" rx="4"/>
      <text x="670" y="455" font-family="sans-serif" font-size="12" fill="#ff4d7d" text-anchor="middle" font-weight="600">
        Materiales
      </text>
      <text x="670" y="475" font-family="sans-serif" font-size="11" fill="#8b9dc3" text-anchor="middle">
        Impresión
      </text>
      <text x="670" y="495" font-family="sans-serif" font-size="11" fill="#8b9dc3" text-anchor="middle">
        Empaque
      </text>
      <text x="670" y="515" font-family="sans-serif" font-size="11" fill="#8b9dc3" text-anchor="middle">
        Señalética
      </text>
    </g>
  </g>

  <!-- Decorative shapes -->
  <g opacity="0.5">
    <circle cx="650" cy="120" r="4" fill="#ff4d7d"/>
    <circle cx="680" cy="150" r="3" fill="#ff4d7d"/>
    <circle cx="720" cy="200" r="2" fill="#ff4d7d"/>
    <line x1="700" y1="250" x2="760" y2="250" stroke="#ff4d7d" stroke-width="1"/>
  </g>
</svg>