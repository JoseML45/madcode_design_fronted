name: Production - Build, Test & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  security-checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  build-test-prod:
    runs-on: ubuntu-latest
    needs: security-checks

    strategy:
      matrix:
        node-version: [18.x]

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run comprehensive linting
      run: npm run lint

    - name: Run unit tests with coverage
      run: npm run test:ci -- --coverage

    - name: Run e2e tests
      run: npm run e2e:ci

    - name: Security audit
      run: npm audit --audit-level=moderate

    - name: SAST - SonarQube scan
      uses: SonarSource/sonarqube-scan-action@master
      env:
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      continue-on-error: true

    - name: Build with production environment
      run: npm run build:prod
      env:
        FIREBASE_API_KEY_PROD: ${{ secrets.FIREBASE_API_KEY_PROD }}
        FIREBASE_PROJECT_ID_PROD: ${{ secrets.FIREBASE_PROJECT_ID_PROD }}
        FIREBASE_SENDER_ID_PROD: ${{ secrets.FIREBASE_SENDER_ID_PROD }}
        FIREBASE_APP_ID_PROD: ${{ secrets.FIREBASE_APP_ID_PROD }}
        SENTRY_DSN_PROD: ${{ secrets.SENTRY_DSN_PROD }}
        GOOGLE_ANALYTICS_ID: ${{ secrets.GOOGLE_ANALYTICS_ID }}

    - name: Minify CSS and HTML
      run: |
        npm install --save-dev html-minifier csso-cli
        find dist/mi-primer-proyecto/browser -name "*.html" -exec npx html-minifier --remove-comments --collapse-whitespace --minify-css true {} -o {} \;
        find dist/mi-primer-proyecto/browser -name "*.css" -exec npx csso {} -o {} \;

    - name: Aggressive Obfuscation and Minification
      run: |
        npm install --save-dev terser
        find dist/mi-primer-proyecto/browser -name "*.js" ! -name "*.min.js" -exec bash -c 'npx terser "$0" --compress --mangle --mangle-props --output "${0%.js}.min.js" && rm "$0" && mv "${0%.js}.min.js" "$0"' {} \;

    - name: Bundle analysis
      run: npm run build:prod -- --stats-json || true

    - name: Archive test coverage
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: coverage/
        retention-days: 30

    - name: Upload build artifact
      uses: actions/upload-artifact@v3
      with:
        name: build-prod
        path: dist/
        retention-days: 30

  deploy-prod:
    needs: build-test-prod
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
    - uses: actions/checkout@v3

    - name: Download build artifact
      uses: actions/download-artifact@v3
      with:
        name: build-prod
        path: dist/

    - name: Deploy to Firebase Production
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        repoToken: '${{ secrets.GITHUB_TOKEN }}'
        firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}'
        channelId: live
        projectId: 'your-project-prod'

    - name: Verify deployment
      run: |
        curl -f https://yourproject.com/index.html > /dev/null 2>&1
        if [ $? -eq 0 ]; then
          echo "✅ Production deployment verified"
        else
          echo "❌ Production deployment failed"
          exit 1
        fi

  post-deployment:
    needs: deploy-prod
    runs-on: ubuntu-latest
    if: success()

    steps:
    - name: Send Slack notification
      uses: slackapi/slack-github-action@v1.24.0
      with:
        payload: |
          {
            "text": "🚀 Production deployment successful!",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "✅ *Production Build Deployed*\n*Branch:* main\n*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n*URL:* https://yourproject.com\n*Author:* ${{ github.actor }}"
                }
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    - name: Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: release-${{ github.run_number }}
        release_name: Production Release ${{ github.run_number }}
        body: |
          🚀 Production Deployment
          - Commit: ${{ github.sha }}
          - Branch: main
          - URL: https://yourproject.com
