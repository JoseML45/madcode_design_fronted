<section class="value-proposition">
  <div class="container">
    <div class="content">
      <h2>¿Por qué tu producto necesita un gran diseño?</h2>
      <p class="subtitle">El diseño no es solo estética, es la experiencia que tus usuarios viven cada día</p>

      <div class="benefits-grid">
        <div *ngFor="let benefit of benefits" class="benefit-card">
          <div class="benefit-icon">→</div>
          <h3>{{ benefit.title }}</h3>
          <p>{{ benefit.description }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
