<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" class="design-image web-design">
  <defs>
    <linearGradient id="webGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:0.05" />
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00d9ff" stroke-width="0.5" opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background gradient -->
  <rect width="800" height="800" fill="url(#webGradient)"/>

  <!-- Grid pattern -->
  <rect width="800" height="800" fill="url(#gridPattern)"/>

  <!-- Browser window -->
  <g>
    <!-- Frame -->
    <rect x="80" y="100" width="640" height="520" fill="none" stroke="#00d9ff" stroke-width="2" rx="12"/>

    <!-- Browser header -->
    <rect x="80" y="100" width="640" height="45" fill="rgba(0, 217, 255, 0.08)" rx="12" ry="12"/>
    <circle cx="110" cy="122" r="4" fill="#ff4d7d" opacity="0.7"/>
    <circle cx="130" cy="122" r="4" fill="#ffa500" opacity="0.7"/>
    <circle cx="150" cy="122" r="4" fill="#00d9ff" opacity="0.7"/>

    <text x="320" y="128" font-family="monospace" font-size="12" fill="#8b9dc3" text-anchor="middle">www.portfolio.design</text>

    <!-- Content area -->
    <rect x="80" y="145" width="640" height="475" fill="rgba(15, 20, 25, 0.6)"/>

    <!-- Header section -->
    <rect x="100" y="165" width="600" height="80" fill="none" stroke="#00d9ff" stroke-width="1" opacity="0.3" rx="6"/>

    <!-- Heading -->
    <text x="100" y="195" font-family="sans-serif" font-size="28" font-weight="bold" fill="#00d9ff">
      UI Design
    </text>
    <text x="100" y="225" font-family="sans-serif" font-size="14" fill="#8b9dc3">
      Interfaces digitales que funcionan
    </text>

    <!-- Card grid -->
    <g>
      <!-- Card 1 -->
      <rect x="100" y="270" width="180" height="140" fill="rgba(0, 217, 255, 0.05)" stroke="#00d9ff" stroke-width="1.5" rx="8"/>
      <circle cx="130" cy="295" r="8" fill="#00d9ff" opacity="0.6"/>
      <rect x="150" y="290" width="100" height="6" fill="#00d9ff" opacity="0.4" rx="3"/>
      <rect x="150" y="305" width="80" height="4" fill="#00d9ff" opacity="0.25" rx="2"/>

      <!-- Card 2 -->
      <rect x="310" y="270" width="180" height="140" fill="rgba(0, 217, 255, 0.05)" stroke="#00d9ff" stroke-width="1.5" rx="8"/>
      <circle cx="340" cy="295" r="8" fill="#00d9ff" opacity="0.6"/>
      <rect x="360" y="290" width="100" height="6" fill="#00d9ff" opacity="0.4" rx="3"/>
      <rect x="360" y="305" width="80" height="4" fill="#00d9ff" opacity="0.25" rx="2"/>

      <!-- Card 3 -->
      <rect x="520" y="270" width="180" height="140" fill="rgba(0, 217, 255, 0.05)" stroke="#00d9ff" stroke-width="1.5" rx="8"/>
      <circle cx="550" cy="295" r="8" fill="#00d9ff" opacity="0.6"/>
      <rect x="570" y="290" width="100" height="6" fill="#00d9ff" opacity="0.4" rx="3"/>
      <rect x="570" y="305" width="80" height="4" fill="#00d9ff" opacity="0.25" rx="2"/>
    </g>

    <!-- Bottom section -->
    <g>
      <rect x="100" y="430" width="600" height="60" fill="rgba(0, 217, 255, 0.03)" stroke="#00d9ff" stroke-width="1" opacity="0.2" rx="6"/>
      <rect x="120" y="445" width="120" height="8" fill="#00d9ff" opacity="0.6" rx="4"/>
      <rect x="260" y="445" width="100" height="8" fill="#00d9ff" opacity="0.4" rx="4"/>
      <rect x="380" y="445" width="140" height="8" fill="#00d9ff" opacity="0.3" rx="4"/>
    </g>
  </g>

  <!-- Code snippet on side -->
  <g opacity="0.6">
    <text x="80" y="650" font-family="monospace" font-size="11" fill="#00d9ff" font-weight="bold">
      &lt;component&gt;
    </text>
    <text x="100" y="668" font-family="monospace" font-size="10" fill="#8b9dc3">
      &lt;interface&gt;
    </text>
    <text x="120" y="685" font-family="monospace" font-size="10" fill="#00d9ff">
      responsive = true
    </text>
    <text x="100" y="702" font-family="monospace" font-size="10" fill="#8b9dc3">
      &lt;/interface&gt;
    </text>
    <text x="80" y="720" font-family="monospace" font-size="11" fill="#00d9ff" font-weight="bold">
      &lt;/component&gt;
    </text>
  </g>

  <!-- Decorative elements -->
  <circle cx="700" cy="150" r="3" fill="#00d9ff" opacity="0.5"/>
  <circle cx="720" cy="180" r="2" fill="#00d9ff" opacity="0.3"/>
  <circle cx="710" cy="220" r="2.5" fill="#00d9ff" opacity="0.4"/>
  <line x1="680" y1="250" x2="750" y2="250" stroke="#00d9ff" stroke-width="1" opacity="0.2"/>
</svg>